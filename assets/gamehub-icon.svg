<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GameHub-iOS logo">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="82%">
      <stop offset="0%" stop-color="#181326"/>
      <stop offset="42%" stop-color="#0e0c16"/>
      <stop offset="100%" stop-color="#07060b"/>
    </radialGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="46%" stop-color="#8b5cf6"/>
      <stop offset="78%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.62  0 1 0 0 0.29  0 0 1 0 0.85  0 0 0 0.9 0" result="colored"/>
      <feMerge>
        <feMergeNode in="colored"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="gripGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.55  0 1 0 0 0.25  0 0 1 0 0.8  0 0 0 0.85 0"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)"/>
  <circle cx="256" cy="248" r="236" fill="url(#halo)"/>

  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#ringGrad)" stroke-width="5" opacity="0.28"/>
  <circle cx="256" cy="256" r="198" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.5"/>

  <g id="pad">
    <g fill="none" stroke="#a78bfa" stroke-width="6" filter="url(#gripGlow)" opacity="0.7">
      <rect x="76" y="290" width="142" height="76" rx="38" transform="rotate(-22 147 328)"/>
      <rect x="294" y="290" width="142" height="76" rx="38" transform="rotate(22 365 328)"/>
      <rect x="150" y="168" width="212" height="178" rx="54"/>
    </g>

    <g>
      <rect x="76" y="290" width="142" height="76" rx="38" transform="rotate(-22 147 328)"/>
      <rect x="294" y="290" width="142" height="76" rx="38" transform="rotate(22 365 328)"/>
      <rect x="150" y="168" width="212" height="178" rx="54"/>
    </g>

    <g fill="#1a1230" stroke="url(#ringGrad)" stroke-width="5">
      <circle cx="212" cy="210" r="30"/>
      <circle cx="300" cy="210" r="30"/>
    </g>
    <g fill="url(#coreGrad)">
      <circle cx="212" cy="210" r="13"/>
      <circle cx="300" cy="210" r="13"/>
    </g>

    <g fill="url(#coreGrad)" stroke="#c4b5fd" stroke-width="2">
      <rect x="200" y="266" width="26" height="50" rx="8"/>
      <rect x="188" y="278" width="50" height="26" rx="8"/>
    </g>

    <g fill="#1a1230" stroke="url(#ringGrad)" stroke-width="4">
      <circle cx="288" cy="300" r="14"/>
      <circle cx="322" cy="300" r="14"/>
    </g>

    <g fill="url(#coreGrad)" opacity="0.95">
      <rect x="238" y="258" width="22" height="9" rx="4.5"/>
      <rect x="258" y="258" width="22" height="9" rx="4.5"/>
    </g>
  </g>

  <use href="#pad" filter="url(#softGlow)"/>
</svg>