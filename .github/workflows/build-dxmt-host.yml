name: Build DXMT Host Lib

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-dxmt-host.yml
      - GameHub/Native/Madeira/DXMTBridge.h
      - GameHub/Native/Madeira/DXMTBridge.m
      - GameHub/Native/Madeira/IOSDisplayShim.m
      - GameHub/Native/Madeira/IOSDisplayShim.h

permissions:
  contents: read

env:
  MADEIRA_COMMIT: 97e2ce26e6dc9e4a38976f3b5deb9272d64558eb
  MADEIRA_REPO: https://github.com/willfaust/Madeira.git
  LLVM_TAG: llvmorg-15.0.7

jobs:
  dxmt:
    name: Build libdxmt_combined.a
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - name: Clone Madeira + research/dxmt + nested headers
        timeout-minutes: 25
        run: |
          set -euo pipefail
          export GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=90
          git clone --filter=blob:none --no-checkout "$MADEIRA_REPO" madeira
          cd madeira
          git fetch --depth 1 origin "$MADEIRA_COMMIT"
          git checkout "$MADEIRA_COMMIT"
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow research/dxmt
          git -C research/dxmt submodule update --init --depth 1 --recommend-shallow include/native/directx || \
            git -C research/dxmt submodule update --init --recursive --depth 1
          test -f research/dxmt/src/winemetal/unix/winemetal_unix.c
          test -f build/dxmt-ios/build.sh
          echo "=== directx headers ==="
          ls research/dxmt/include/native/directx | head || true
          test -f research/dxmt/include/native/directx/d3d11.h \
            || test -f research/dxmt/include/native/directx/include/d3d11.h \
            || find research/dxmt/include -name 'd3d11.h' | tee /tmp/d3d11.path
          test -s /tmp/d3d11.path || test -f research/dxmt/include/native/directx/d3d11.h

      - name: Cache iOS LLVM 15
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/toolchains/llvm-ios-build
            ${{ github.workspace }}/toolchains/llvm-host-tblgen
          key: llvm15-ios-arm64-${{ env.LLVM_TAG }}-libs-only-v3

      - name: Build LLVM 15.0.7 host tblgen + iOS static libs
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        timeout-minutes: 140
        run: |
          set -euo pipefail
          brew install ninja cmake || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          ROOT="$GITHUB_WORKSPACE/toolchains"
          mkdir -p "$ROOT"
          if [ ! -d "$ROOT/llvm-project/.git" ]; then
            git clone --depth 1 --branch "$LLVM_TAG" https://github.com/llvm/llvm-project.git "$ROOT/llvm-project"
          fi
          ADD="$ROOT/llvm-project/llvm/cmake/modules/AddLLVM.cmake"
          if grep -q 'MATCHES "Darwin"' "$ADD"; then
            sed -i.bak 's/MATCHES "Darwin"/MATCHES "Darwin|iOS"/' "$ADD" || true
          fi
          echo "=== host llvm-tblgen ==="
          cmake -S "$ROOT/llvm-project/llvm" -B "$ROOT/llvm-host-tblgen" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD="" \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF
          cmake --build "$ROOT/llvm-host-tblgen" --target llvm-tblgen -j 4
          TBLGEN="$ROOT/llvm-host-tblgen/bin/llvm-tblgen"
          test -x "$TBLGEN"
          echo "=== iOS LLVM static libs (no tools/examples) ==="
          cmake -S "$ROOT/llvm-project/llvm" -B "$ROOT/llvm-ios-build" -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DLLVM_TABLEGEN="$TBLGEN" \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_FFI=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_INCLUDE_TOOLS=OFF \
            -DLLVM_BUILD_UTILS=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_PIC=ON
          if cmake --build "$ROOT/llvm-ios-build" --target llvm-libraries -j 4; then
            echo "built target llvm-libraries"
          else
            echo "llvm-libraries target missing; building core static libs"
            cmake --build "$ROOT/llvm-ios-build" --target \
              LLVMSupport LLVMCore LLVMBitReader LLVMAsmParser LLVMIRReader \
              LLVMAnalysis LLVMTransformUtils LLVMInstCombine LLVMScalarOpts \
              LLVMBitWriter LLVMObject LLVMMC LLVMBinaryFormat LLVMDemangle \
              LLVMRemarks LLVMBitstreamReader LLVMMCParser LLVMProfileData \
              LLVMTarget -j 4
          fi
          test -d "$ROOT/llvm-ios-build/lib"
          ls "$ROOT/llvm-ios-build/lib"/libLLVM*.a | head
          test -f "$ROOT/llvm-ios-build/include/llvm/Config/llvm-config.h"
          test -f "$ROOT/llvm-ios-build/lib/libLLVMSupport.a"
          test -f "$ROOT/llvm-ios-build/lib/libLLVMCore.a"

      - name: Compile Madeira DXMT unix + airconv + DXBCParser + LLVM combine
        run: |
          set -euo pipefail
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          OUT="$GITHUB_WORKSPACE/host-libs"
          OBJ="$GITHUB_WORKSPACE/dxmt-obj"
          mkdir -p "$OUT" "$OBJ"
          DXMT_ROOT="$GITHUB_WORKSPACE/madeira/research/dxmt"
          DXMT_SRC="$DXMT_ROOT/src"
          LLVM_SRC="$GITHUB_WORKSPACE/toolchains/llvm-project/llvm"
          LLVM_BUILD="$GITHUB_WORKSPACE/toolchains/llvm-ios-build"
          if [ ! -d "$LLVM_SRC/include" ]; then
            git clone --depth 1 --branch "$LLVM_TAG" https://github.com/llvm/llvm-project.git "$GITHUB_WORKSPACE/toolchains/llvm-project"
          fi
          test -d "$LLVM_BUILD/include"
          test -d "$LLVM_BUILD/lib"
          D3D_INC=""
          if [ -f "$DXMT_ROOT/include/native/directx/d3d11.h" ]; then
            D3D_INC="-I$DXMT_ROOT/include/native/directx"
          else
            D3D_DIR=$(find "$DXMT_ROOT/include" -name d3d11.h -print -quit | xargs dirname)
            D3D_INC="-I$D3D_DIR"
          fi
          SHDR="$OBJ/shader-headers"
          mkdir -p "$SHDR"
          echo "=== generate airconv shader headers (xxd of AIR bitcode) ==="
          xcodebuild -downloadComponent MetalToolchain || true
          SHADER_DIR="$DXMT_SRC/airconv/shaders"
          ls -la "$SHADER_DIR" || true
          for name in air_msad air_samplepos air_tessellation; do
            src="$SHADER_DIR/${name}.metal"
            test -f "$src"
            air="$SHDR/${name}.air"
            hdr="$SHDR/${name}.h"
            set +e
            xcrun -sdk macosx metal -std=metal3.1 --target=air64-apple-macos14.0 -c "$src" -o "$air" 2>"$SHDR/${name}.metal.err"
            rc=$?
            if [ $rc -ne 0 ]; then
              xcrun -sdk iphoneos metal -std=metal3.1 -c "$src" -o "$air" 2>>"$SHDR/${name}.metal.err"
              rc=$?
            fi
            set -e
            if [ $rc -ne 0 ] || [ ! -s "$air" ]; then
              echo "FAILED metal compile $name" >&2
              cat "$SHDR/${name}.metal.err" >&2 || true
              exit 1
            fi
            xxd -n "$name" -i "$air" "$hdr"
            test -s "$hdr"
            grep -q "$name" "$hdr"
            echo "  header $name.h ($(wc -c < "$hdr" | tr -d ' ') bytes)"
          done
          COMMON="-arch arm64 -isysroot $SDK -miphoneos-version-min=17.0 -fblocks -O2 -fPIC"
          INCLUDES="-I$DXMT_ROOT/include -I$DXMT_ROOT/libs -I$DXMT_SRC/winemetal -I$DXMT_SRC/airconv"
          INCLUDES_DX="-I$DXMT_ROOT/include/native/directx -I$DXMT_ROOT/include/native/windows $D3D_INC"
          INCLUDES_SHADERS="-I$SHDR"
          LLVM_INCLUDES="-I$LLVM_BUILD/include -I$LLVM_SRC/include"
          AIRDEFS="-D_FILE_OFFSET_BITS=64 -D__STDC_CONSTANT_MACROS -D__STDC_FORMAT_MACROS -D__STDC_LIMIT_MACROS"
          compile_objc() {
            local src=$1 name=$2
            [ -f "$src" ] || { echo "MISSING $name ($src)" >&2; return 1; }
            echo -n "  objc $name... "
            if xcrun -sdk iphoneos clang $COMMON -x objective-c $INCLUDES \
              -c "$src" -o "$OBJ/$name.o" 2>"$OBJ/err-$name.txt"; then
              echo OK
              return 0
            fi
            echo FAILED
            cat "$OBJ/err-$name.txt" || true
            return 1
          }
          compile_cxx() {
            local src=$1 name=$2 extra="${3:-}"
            [ -f "$src" ] || { echo "MISSING cxx $name ($src)" >&2; return 1; }
            echo -n "  cxx  $name... "
            if xcrun -sdk iphoneos clang++ $COMMON -std=c++20 -fno-exceptions -fno-rtti \
              $INCLUDES $INCLUDES_DX $INCLUDES_SHADERS $LLVM_INCLUDES $AIRDEFS $extra -c "$src" -o "$OBJ/$name.o" 2>"$OBJ/err-$name.txt"; then
              echo OK
              return 0
            fi
            echo FAILED
            head -40 "$OBJ/err-$name.txt" || true
            return 1
          }
          echo "=== winemetal unix ==="
          compile_objc "$DXMT_SRC/winemetal/unix/winemetal_unix.c" winemetal_unix
          compile_objc "$DXMT_SRC/winemetal/unix/cache.c" cache
          echo "=== airconv ==="
          AIR_FAIL=0
          for cpp in airconv_context.cpp air_type.cpp air_signature.cpp air_operations.cpp \
                     dxbc_converter.cpp dxbc_converter_gs.cpp dxbc_converter_ts.cpp \
                     dxbc_converter_basicblock.cpp dxbc_converter_cfg.cpp \
                     dxbc_instructions.cpp dxbc_signature.cpp metallib_writer.cpp; do
            compile_cxx "$DXMT_SRC/airconv/$cpp" "${cpp%.cpp}" || AIR_FAIL=1
          done
          compile_cxx "$DXMT_SRC/airconv/nt/air_builder.cpp" air_builder || AIR_FAIL=1
          compile_cxx "$DXMT_SRC/airconv/nt/dxbc_converter_base.cpp" dxbc_converter_base || AIR_FAIL=1
          if [ -f "$DXMT_SRC/airconv/transforms/lower_16bit_texread.cpp" ]; then
            compile_cxx "$DXMT_SRC/airconv/transforms/lower_16bit_texread.cpp" lower_16bit_texread || AIR_FAIL=1
          fi
          if [ -f "$DXMT_SRC/airconv/transforms/simdgroup_implicit_membarrier.cpp" ]; then
            compile_cxx "$DXMT_SRC/airconv/transforms/simdgroup_implicit_membarrier.cpp" simdgroup_implicit_membarrier || AIR_FAIL=1
          fi
          for extra in dxbc_binding_sm50.cpp dxbc_binding_rootsig.cpp; do
            if [ -f "$DXMT_SRC/airconv/$extra" ]; then
              compile_cxx "$DXMT_SRC/airconv/$extra" "${extra%.cpp}" || AIR_FAIL=1
            fi
          done
          echo "=== DXBCParser ==="
          for cpp in BlobContainer.cpp DXBCUtils.cpp ShaderBinary.cpp; do
            src="$DXMT_ROOT/libs/DXBCParser/$cpp"
            name=dxbc_$(basename "$cpp" .cpp)
            echo -n "  cxx  $name... "
            if xcrun -sdk iphoneos clang++ $COMMON -std=c++20 -fno-rtti \
                $INCLUDES $INCLUDES_DX $INCLUDES_SHADERS $LLVM_INCLUDES $AIRDEFS -c "$src" -o "$OBJ/$name.o" 2>"$OBJ/err-$name.txt"; then
              echo OK
            else
              echo FAILED
              head -30 "$OBJ/err-$name.txt" || true
              AIR_FAIL=1
            fi
          done
          printf '%s\n' 'int dxmt_host_probe(void) { return 1; }' > "$OBJ/dxmt_host_probe.c"
          xcrun -sdk iphoneos clang $COMMON -c "$OBJ/dxmt_host_probe.c" -o "$OBJ/dxmt_host_probe.o"
          test -f "$OBJ/winemetal_unix.o"
          test -f "$OBJ/cache.o"
          test -f "$OBJ/airconv_context.o"
          test -f "$OBJ/dxbc_converter.o"
          test "$AIR_FAIL" -eq 0
          NOBJ=$(find "$OBJ" -name '*.o' -type f | wc -l | tr -d ' ')
          echo "dxmt-objs=$NOBJ"
          test "$NOBJ" -ge 16
          echo "=== combining with iOS LLVM static libs ==="
          xcrun -sdk iphoneos libtool -static -o "$OUT/libdxmt_combined.a" \
            "$OBJ"/*.o "$LLVM_BUILD"/lib/libLLVM*.a
          cp -v "$OUT/libdxmt_combined.a" "$OUT/libdxmt_unix.a"
          ls -lh "$OUT"/*.a
          file "$OUT/libdxmt_combined.a"
          echo "=== required symbols ==="
          nm -gU "$OUT/libdxmt_combined.a" | tee "$OUT/libdxmt.nm" | head -80
          grep -q 'dxmt_host_probe' "$OUT/libdxmt.nm"
          if ! grep -E -q 'winemetal|dxmt_winemetal|MTLCreateSystemDefaultDevice|airconv' "$OUT/libdxmt.nm"; then
            echo "WARNING: archive missing obvious DXMT/Metal symbols" >&2
            grep -E ' T ' "$OUT/libdxmt.nm" | head -40 || true
          fi
          SZ=$(wc -c < "$OUT/libdxmt_combined.a")
          echo "size=$SZ"
          test "$SZ" -gt 1000000

      - name: Upload madeira-host-libs
        uses: actions/upload-artifact@v4
        with:
          name: madeira-host-libs
          path: ${{ github.workspace }}/host-libs
          if-no-files-found: error
          retention-days: 21
