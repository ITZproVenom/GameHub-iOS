name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/build-madeira-host.yml"

permissions:
  contents: write
  actions: read

env:
  MADEIRA_COMMIT: 97e2ce26e6dc9e4a38976f3b5deb9272d64558eb
  MADEIRA_REPO: https://github.com/willfaust/Madeira.git

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Fetch Madeira PE + bridges + prefix
        run: |
          set -euo pipefail
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=120
          rm -rf /tmp/madeira-rt
          git clone --filter=blob:none --sparse "$MADEIRA_REPO" /tmp/madeira-rt
          cd /tmp/madeira-rt
          git fetch --depth 1 origin "$MADEIRA_COMMIT"
          git checkout "$MADEIRA_COMMIT"
          git sparse-checkout set app/Madeira
          git sparse-checkout reapply || true

          test -d app/Madeira/aarch64-windows
          test -d app/Madeira/arm64ec-windows

          RT="$GITHUB_WORKSPACE/GameHub/Resources/Runtime"
          mkdir -p "$RT"
          rm -rf "$RT/aarch64-windows" "$RT/arm64ec-windows" "$RT/nls"
          cp -R app/Madeira/aarch64-windows "$RT/"
          cp -R app/Madeira/arm64ec-windows "$RT/"
          if [[ -f app/Madeira/prefix-template.tar.gz ]]; then
            cp -v app/Madeira/prefix-template.tar.gz "$RT/"
          else
            mkdir -p /tmp/pfx/drive_c/windows/system32
            echo "Madeira minimal prefix" > /tmp/pfx/README
            (cd /tmp/pfx && tar czf "$RT/prefix-template.tar.gz" .)
          fi
          cp -v app/Madeira/cacert.pem "$RT/" 2>/dev/null || true
          for lib in libgmp.a libgnutls.a libhogweed.a libnettle.a; do
            [[ -f "app/Madeira/$lib" ]] && cp -v "app/Madeira/$lib" "$RT/"
          done
          [[ -d app/Madeira/nls ]] && cp -R app/Madeira/nls "$RT/" || true
          printf '%s\nMadeira PE+prefix bundle\n' "$MADEIRA_COMMIT" > "$RT/VERSION"

          NAT="$GITHUB_WORKSPACE/GameHub/Native/Madeira"
          for f in WineServerBridge.m WineProcessBridge.m IOSDisplayShim.m JITAllocator.c PrefixExtractor.c; do
            if [[ -f "app/Madeira/$f" ]]; then
              cp -v "app/Madeira/$f" "$NAT/$f"
            fi
          done
          for f in WineServerBridge.h WineProcessBridge.h IOSDisplayShim.h JITAllocator.h PrefixExtractor.h; do
            if [[ -f "app/Madeira/$f" ]]; then
              cp -v "app/Madeira/$f" "$NAT/$f"
            fi
          done

          echo "=== Runtime payload ==="
          du -sh "$RT"
          test -f "$RT/prefix-template.tar.gz"
          test -f "$RT/aarch64-windows/d3d11.dll" || test -f "$RT/arm64ec-windows/d3d11.dll"
          BYTES=$(du -sk "$RT" | awk '{print $1 * 1024}')
          [[ "$BYTES" -gt 20000000 ]]

      - name: Try restore host static libs artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HL="$GITHUB_WORKSPACE/GameHub/Native/Madeira/HostLibs"
          mkdir -p "$HL"
          RUN_ID=$(gh run list --workflow="Build Madeira Host Libs" --status=success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          if [[ -z "${RUN_ID:-}" ]]; then
            RUN_ID=$(gh run list --workflow=build-madeira-host.yml --status=success --limit 1 --json databaseId -q '.[0].databaseId' 2>/dev/null || true)
          fi
          if [[ -n "${RUN_ID:-}" ]]; then
            echo "Downloading host-libs from run $RUN_ID"
            mkdir -p /tmp/hl
            gh run download "$RUN_ID" -n madeira-host-libs -D /tmp/hl 2>/dev/null || true
            find /tmp/hl -name '*.a' -size +10k -exec cp -v {} "$HL/" \; || true
            find /tmp/hl -path '*/fex/*.a' -size +10k -exec cp -v {} "$HL/" \; || true
          fi
          echo "=== HostLibs ==="
          ls -lh "$HL" 2>/dev/null || echo "(empty)"
          {
            for lib in libntdll_unix.a libwineserver.a libFEXCore.a libdxmt_combined.a libfmt.a libxxhash.a libsoftfloat_3e.a; do
              if [[ -s "$HL/$lib" ]]; then
                echo "  FOUND $lib $(wc -c < "$HL/$lib")"
              fi
            done
          } | tee "$HL/STATUS.txt" || true

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          python3 -c '
          from pathlib import Path
          p = Path("GameHub.xcodeproj/project.pbxproj")
          text = p.read_text()
          assert "isa = PBXProject" in text
          assert text.count("{") == text.count("}"), "unbalanced braces"
          assert ";" in text
          p.write_text(text)
          print("xcodegen ok", len(text))
          '
          xcodebuild -list -project GameHub.xcodeproj

      - name: Archive unsigned
        run: |
          set -euo pipefail
          HL="$GITHUB_WORKSPACE/GameHub/Native/Madeira/HostLibs"
          BASE_LD="-framework Metal -framework QuartzCore -framework UIKit -framework GameController -lz -lc++"

          archive_with() {
            local extra="$1"
            xcodebuild archive \
              -project GameHub.xcodeproj \
              -scheme GameHub \
              -configuration Release \
              -archivePath "$PWD/build/GameHub.xcarchive" \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              OTHER_LDFLAGS="$extra $BASE_LD"
          }

          # Prefer host libs that are known to exist; FEXCore often has unresolved
          # symbols until FEX headers/bridges are vendored. Try full set first,
          # then drop FEXCore*, then drop all force_loads. Never invent an IPA.
          FULL=""
          NOFEX=""
          for lib in libwineserver.a libntdll_unix.a libwin32u_unix.a libFEXCore.a libFEXCore_Base.a libdxmt_combined.a libfmt.a libxxhash.a libsoftfloat_3e.a libcephes_128bit.a; do
            if [[ -s "$HL/$lib" ]] && [[ $(wc -c < "$HL/$lib") -gt 50000 ]]; then
              FULL="$FULL -force_load $HL/$lib"
              case "$lib" in
                libFEXCore*) ;;
                *) NOFEX="$NOFEX -force_load $HL/$lib" ;;
              esac
              echo "candidate force_load $lib ($(wc -c < "$HL/$lib") bytes)"
            fi
          done

          set +e
          if [[ -n "$FULL" ]]; then
            echo "=== Archive attempt 1: full host force_load ==="
            archive_with "$FULL"
            RC=$?
          else
            RC=1
          fi
          if [[ $RC -ne 0 && -n "$NOFEX" ]]; then
            echo "=== Archive attempt 2: host libs without FEXCore ==="
            archive_with "$NOFEX"
            RC=$?
          fi
          if [[ $RC -ne 0 ]]; then
            echo "=== Archive attempt 3: app + Madeira bridges only (no force_load) ==="
            archive_with ""
            RC=$?
          fi
          set -e
          if [[ $RC -ne 0 ]]; then
            echo "ERROR: all archive attempts failed" >&2
            exit $RC
          fi
          test -d "$PWD/build/GameHub.xcarchive/Products/Applications/GameHub.app"

      - name: Package IPA + force-embed Runtime + verify
        run: |
          set -euo pipefail
          APP="build/GameHub.xcarchive/Products/Applications/GameHub.app"
          test -d "$APP"
          test -f "$APP/GameHub"
          file "$APP/GameHub"

          RT="$GITHUB_WORKSPACE/GameHub/Resources/Runtime"
          test -d "$RT/aarch64-windows"
          test -f "$RT/prefix-template.tar.gz"

          echo "Force-embedding Runtime into .app ..."
          rm -rf "$APP/Runtime"
          mkdir -p "$APP/Runtime"
          cp -R "$RT/aarch64-windows" "$APP/Runtime/"
          cp -R "$RT/arm64ec-windows" "$APP/Runtime/"
          cp -v "$RT/prefix-template.tar.gz" "$APP/Runtime/"
          cp -v "$RT/VERSION" "$APP/Runtime/"
          [[ -f "$RT/cacert.pem" ]] && cp -v "$RT/cacert.pem" "$APP/Runtime/" || true
          for lib in libgmp.a libgnutls.a libhogweed.a libnettle.a; do
            [[ -f "$RT/$lib" ]] && cp -v "$RT/$lib" "$APP/Runtime/" || true
          done
          [[ -d "$RT/nls" ]] && cp -R "$RT/nls" "$APP/Runtime/" || true

          du -sh "$APP/Runtime"
          test -f "$APP/Runtime/aarch64-windows/d3d11.dll" || test -f "$APP/Runtime/arm64ec-windows/d3d11.dll"
          test -f "$APP/Runtime/prefix-template.tar.gz"

          mkdir -p build/Payload
          rm -rf build/Payload/GameHub.app
          cp -R "$APP" build/Payload/
          (cd build && zip -qr GameHub.ipa Payload)
          ls -lh build/GameHub.ipa

          python3 << 'PY'
          import zipfile, os, sys
          path = "build/GameHub.ipa"
          size = os.path.getsize(path)
          print(f"IPA size: {size} bytes ({size/1024/1024:.1f} MiB)")
          z = zipfile.ZipFile(path)
          names = z.namelist()
          assert any(n.endswith("GameHub.app/GameHub") for n in names), "missing binary"
          for m in ("prefix-template.tar.gz", "VERSION", "d3d11.dll"):
              hits = [n for n in names if n.endswith(m)]
              print(f"  {m}: {len(hits)}", hits[:3])
              assert hits, f"missing {m}"
          if size < 20_000_000:
              print("ERROR: IPA too small", size, file=sys.stderr)
              sys.exit(1)
          print("VERIFIED: runtime-bearing IPA")
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-ipa
          path: build/GameHub.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Changelog
        id: meta
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          STAMP="$(date -u +'%Y%m%d-%H%M')"
          RUN="${{ github.run_number }}"
          SIZE=$(ls -lh build/GameHub.ipa | awk '{print $5}')
          HL="$GITHUB_WORKSPACE/GameHub/Native/Madeira/HostLibs"
          HOST_STATUS="no host .a"
          if ls "$HL"/*.a 1>/dev/null 2>&1; then
            HOST_STATUS="$(ls "$HL"/*.a 2>/dev/null | xargs -n1 basename | tr '\n' ' ')"
          fi
          echo "tag=ios-runtime-${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=GameHub iOS + Madeira runtime #${RUN} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          {
            echo "## GameHub iOS + Madeira runtime"
            echo ""
            echo "**Build:** \`${SHORT_SHA}\`"
            echo "**IPA size:** ${SIZE}"
            echo "**Madeira:** \`${MADEIRA_COMMIT}\`"
            echo "**Host libs present:** ${HOST_STATUS}"
            echo ""
            echo "PE sysroots + prefix-template + bridges. Host static libs linked when they resolve."
            echo ""
            echo "### Install"
            echo "Unsigned — **AltStore** / **Sideloadly** / **TrollStore** + JIT (StikDebug)."
            echo ""
            echo "**Latest:** [GameHub.ipa](https://github.com/ITZproVenom/GameHub-iOS/releases/latest/download/GameHub.ipa)"
          } > release_notes.md

      - name: Publish versioned GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          body_path: release_notes.md
          files: build/GameHub.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish / update latest release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GameHub iOS — Latest IPA
          prerelease: false
          make_latest: true
          body_path: release_notes.md
          files: build/GameHub.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
