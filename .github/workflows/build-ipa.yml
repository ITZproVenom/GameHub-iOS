name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          python3 - <<'PY'
from pathlib import Path
import re
p = Path("GameHub.xcodeproj/project.pbxproj")
text = re.sub(r"objectVersion = \d+;", "objectVersion = 56;", p.read_text())
p.write_text(text)
print("project ready")
PY

      - name: Archive unsigned
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project GameHub.xcodeproj \
            -scheme GameHub \
            -configuration Release \
            -archivePath "$PWD/build/GameHub.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package IPA
        run: |
          set -euo pipefail
          APP="build/GameHub.xcarchive/Products/Applications/GameHub.app"
          test -d "$APP"
          test -f "$APP/GameHub" || test -x "$APP/GameHub"
          mkdir -p build/Payload
          rm -rf build/Payload/GameHub.app
          cp -R "$APP" build/Payload/
          # Ensure Runtime README ships in the bundle if XcodeGen included Resources
          (cd build && zip -qr GameHub.ipa Payload)
          ls -lh build/GameHub.ipa
          python3 - <<'PY'
import zipfile, sys
z = zipfile.ZipFile("build/GameHub.ipa")
names = z.namelist()
assert any(n.endswith("GameHub.app/GameHub") or n == "Payload/GameHub.app/GameHub" for n in names), "missing exe"
print("IPA entries", len(names))
PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-ipa
          path: build/GameHub.ipa
          if-no-files-found: error

      - name: Changelog
        id: meta
        run: |
          SHORT_SHA="$(echo '${{ github.sha }}' | cut -c1-7)"
          STAMP="$(date -u +'%Y%m%d-%H%M')"
          RUN="${{ github.run_number }}"
          echo "tag=ios-build-${STAMP}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "name=GameHub iOS build #${RUN} (${SHORT_SHA})" >> "$GITHUB_OUTPUT"
          {
            echo "## GameHub iOS"
            echo ""
            echo "**Build:** \`${SHORT_SHA}\`"
            echo ""
            echo "Unsigned IPA — install with AltStore / Sideloadly / TrollStore."
            echo ""
            echo "### Runtime"
            echo "Local Windows .exe launch requires Madeira binaries in the Runtime folder"
            echo "(wine64, FEXInterpreter, dxmt11.dylib, VERSION). See Runtime README in the app."
            echo ""
            echo "### Commits"
            git log --max-count=12 --pretty=format:'- %s (%h)' --no-merges
          } > release_notes.md

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: true
          body_path: release_notes.md
          files: build/GameHub.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
