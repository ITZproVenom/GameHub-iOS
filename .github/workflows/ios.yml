name: iOS Build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (iOS)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          set -euo pipefail
          XCODE_PATH=$(ls /Applications | grep -E '^Xcode_15.*\.app$' | sort -V | tail -1 || true)
          if [[ -n "$XCODE_PATH" ]]; then
            sudo xcode-select --switch "/Applications/$XCODE_PATH"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen 2.42.0
        run: |
          set -euo pipefail
          brew install xcodegen
          # Force objectVersion compatible with Xcode 15 via project.yml xcodeVersion
          xcodegen --version

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          python3 - <<'PY'
from pathlib import Path
p = Path('GameHub.xcodeproj/project.pbxproj')
text = p.read_text()
# Downgrade future format if a newer XcodeGen emitted objectVersion 77.
text = text.replace('objectVersion = 77;', 'objectVersion = 56;')
text = text.replace('objectVersion = 63;', 'objectVersion = 56;')
text = text.replace('objectVersion = 70;', 'objectVersion = 56;')
p.write_text(text)
print('objectVersion line:', [l.strip() for l in text.splitlines() if 'objectVersion' in l][:3])
PY

      - name: List available simulators
        run: xcrun simctl list devices available | head -40

      - name: Build app for simulator (Debug, no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project GameHub.xcodeproj \
            -scheme GameHub \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests (simulator, no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project GameHub.xcodeproj \
            -scheme GameHub \
            -configuration Debug \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Build generic iOS device (Release, no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project GameHub.xcodeproj \
            -scheme GameHub \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedDataDevice \
            -archivePath DerivedDataDevice/GameHub.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="DerivedDataDevice/GameHub.xcarchive/Products/Applications/GameHub.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App bundle not found at $APP_PATH"
            ls -la DerivedDataDevice/GameHub.xcarchive/Products/Applications/ 2>/dev/null || true
            exit 1
          fi
          mkdir -p "DerivedDataDevice/Payload"
          cp -R "$APP_PATH" DerivedDataDevice/Payload/
          pushd DerivedDataDevice
          zip -qr GameHub-unsigned.ipa Payload
          popd
          echo "IPA created: DerivedDataDevice/GameHub-unsigned.ipa"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-app
          path: DerivedData/Build/Products/Debug-iphonesimulator/GameHub.app
          if-no-files-found: error

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-unsigned-ipa
          path: DerivedDataDevice/GameHub-unsigned.ipa
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            DerivedData/Logs
            DerivedDataDevice/Logs
          if-no-files-found: ignore
