name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          python3 -c '
          from pathlib import Path
          import re
          p = Path("GameHub.xcodeproj/project.pbxproj")
          text = re.sub(r"objectVersion = \d+;", "objectVersion = 56;", p.read_text())
          assert text.count("{") == text.count("}")
          p.write_text(text)
          print("objectVersion fixed")
          '

      - name: Archive (unsigned)
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project GameHub.xcodeproj \
            -scheme GameHub \
            -configuration Release \
            -archivePath build/GameHub.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: Package IPA
        run: |
          set -euo pipefail
          test -d build/GameHub.xcarchive/Products/Applications/GameHub.app
          test -f build/GameHub.xcarchive/Products/Applications/GameHub.app/GameHub
          mkdir -p build/Payload
          cp -R build/GameHub.xcarchive/Products/Applications/GameHub.app build/Payload/
          cd build
          zip -qr GameHub-unsigned.ipa Payload
          ls -lh GameHub-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameHub-unsigned-ipa
          path: build/GameHub-unsigned.ipa
          if-no-files-found: error

      - name: Publish release
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}-${{ github.sha }}
          name: GameHub iOS build #${{ github.run_number }}
          prerelease: true
          body: |
            Unsigned IPA from `${{ github.sha }}`.
            Install with AltStore / Sideloadly / TrollStore.
          files: build/GameHub-unsigned.ipa
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
