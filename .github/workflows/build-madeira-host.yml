name: Build Madeira Host Libs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-madeira-host.yml"

permissions:
  contents: read
  actions: read

env:
  MADEIRA_COMMIT: 97e2ce26e6dc9e4a38976f3b5deb9272d64558eb
  MADEIRA_REPO: https://github.com/willfaust/Madeira.git
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-macos-universal.tar.xz
  CACHE_VERSION: v5
  # Prior successful run that produced real libntdll_unix.a + libwin32u_unix.a
  SEED_ARTIFACT_RUN_ID: "34887511780"
  SEED_ARTIFACT_ID: "10365920790"

jobs:
  host-libs:
    name: Build host static libraries
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Install build deps + llvm-mingw
        run: |
          set -euo pipefail
          brew install cmake ninja flex bison pkg-config wget python3 coreutils || true
          python3 -m pip install --break-system-packages --user packaging setuptools || true
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"

          mkdir -p "$HOME/toolchains"
          if [[ ! -x "$HOME/toolchains/llvm-mingw/bin/aarch64-w64-mingw32-clang" ]]; then
            curl -L --retry 3 --max-time 120 -o /tmp/llvm-mingw.tar.xz "$LLVM_MINGW_URL"
            tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME/toolchains"
            ln -sfn "$HOME/toolchains"/llvm-mingw-*-ucrt-macos-universal "$HOME/toolchains/llvm-mingw"
            rm -f /tmp/llvm-mingw.tar.xz
          fi
          echo "$HOME/toolchains/llvm-mingw/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/toolchains/llvm-mingw/bin:$PATH"
          aarch64-w64-mingw32-clang --version | head -1 || true

      - name: Cache llvm-mingw toolchain
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw
          key: llvm-mingw-20260826-${{ env.CACHE_VERSION }}

      - name: Cache previous successful host libs
        id: cache-libs
        uses: actions/cache@v4
        with:
          path: host-libs-cache
          key: madeira-host-libs-${{ env.MADEIRA_COMMIT }}-${{ env.CACHE_VERSION }}
          restore-keys: |
            madeira-host-libs-${{ env.MADEIRA_COMMIT }}-
            madeira-host-libs-

      - name: Restore cache + seed verified libs from prior artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p host-libs host-libs-cache "$GITHUB_WORKSPACE/host-libs"

          # 1) Restore from actions/cache
          if [[ -d host-libs-cache ]]; then
            find host-libs-cache -name '*.a' -size +1k -exec cp -v {} host-libs/ \; || true
            find host-libs-cache -path '*/fex/*.a' -size +1k -exec mkdir -p host-libs/fex \; -exec cp -v {} host-libs/fex/ \; || true
          fi

          # 2) If ntdll/win32u still missing, seed from known-good artifact (run #10)
          need_seed=0
          [[ ! -s host-libs/libntdll_unix.a ]] && need_seed=1
          [[ ! -s host-libs/libwin32u_unix.a ]] && need_seed=1
          if [[ $need_seed -eq 1 ]]; then
            echo "Seeding verified libs from artifact $SEED_ARTIFACT_ID (run $SEED_ARTIFACT_RUN_ID)..."
            mkdir -p /tmp/seed
            # Use gh api to get download URL then curl
            URL=$(gh api "repos/${{ github.repository }}/actions/artifacts/${SEED_ARTIFACT_ID}/zip" -H "Accept: application/vnd.github+json" --jq '.' 2>/dev/null || true)
            # Fallback: direct download via gh
            gh run download "$SEED_ARTIFACT_RUN_ID" -n madeira-host-libs -D /tmp/seed 2>/dev/null || {
              echo "gh run download failed; trying curl with token"
              curl -sL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${SEED_ARTIFACT_ID}/zip" \
                -o /tmp/seed.zip || true
              unzip -o /tmp/seed.zip -d /tmp/seed 2>/dev/null || true
            }
            find /tmp/seed -name 'libntdll_unix.a' -size +100k -exec cp -v {} host-libs/ \; || true
            find /tmp/seed -name 'libwin32u_unix.a' -size +100k -exec cp -v {} host-libs/ \; || true
            find /tmp/seed -name 'libntdll_unix.a' -size +100k -exec cp -v {} host-libs-cache/ \; || true
            find /tmp/seed -name 'libwin32u_unix.a' -size +100k -exec cp -v {} host-libs-cache/ \; || true
          fi

          cp -v host-libs/*.a "$GITHUB_WORKSPACE/host-libs/" 2>/dev/null || true
          echo "=== host-libs after restore/seed ==="
          ls -lh host-libs/*.a 2>/dev/null || echo "(none)"

          # Valid env names only (no dots)
          if [[ -s host-libs/libntdll_unix.a ]] && [[ $(wc -c < host-libs/libntdll_unix.a) -gt 10000 ]]; then
            echo "SKIP_NTDLL=1" >> "$GITHUB_ENV"
            echo "Will SKIP ntdll rebuild"
          else
            echo "SKIP_NTDLL=0" >> "$GITHUB_ENV"
          fi
          if [[ -s host-libs/libwineserver.a ]] && [[ $(wc -c < host-libs/libwineserver.a) -gt 10000 ]]; then
            echo "SKIP_WINESERVER=1" >> "$GITHUB_ENV"
            echo "Will SKIP wineserver rebuild"
          else
            echo "SKIP_WINESERVER=0" >> "$GITHUB_ENV"
          fi
          if [[ -s host-libs/libwin32u_unix.a ]] && [[ $(wc -c < host-libs/libwin32u_unix.a) -gt 10000 ]]; then
            echo "SKIP_WIN32U=1" >> "$GITHUB_ENV"
            echo "Will SKIP win32u rebuild"
          else
            echo "SKIP_WIN32U=0" >> "$GITHUB_ENV"
          fi
          if ls host-libs/fex/libFEXCore*.a 1>/dev/null 2>&1; then
            echo "SKIP_FEX=1" >> "$GITHUB_ENV"
            echo "Will SKIP FEX rebuild"
          else
            echo "SKIP_FEX=0" >> "$GITHUB_ENV"
          fi

      - name: Clone Madeira + wine + FEX
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=45
          rm -rf madeira
          git clone --depth 1 --filter=blob:none --no-checkout "$MADEIRA_REPO" madeira
          cd madeira
          git fetch --depth 1 origin "$MADEIRA_COMMIT"
          git checkout "$MADEIRA_COMMIT"
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 2 wine
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 2 FEX
          echo "wine=$(git -C wine rev-parse --short HEAD) FEX=$(git -C FEX rev-parse --short HEAD)"

      - name: Stage A — Wine host configure
        id: wine_cfg
        continue-on-error: true
        timeout-minutes: 4
        run: |
          set -euo pipefail
          export PATH="$HOME/toolchains/llvm-mingw/bin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          export BISON="/opt/homebrew/opt/bison/bin/bison"
          export FLEX="/opt/homebrew/opt/flex/bin/flex"
          cd madeira/wine
          mkdir -p build-macos && cd build-macos
          ../configure \
            --enable-win64 \
            --without-x \
            --without-freetype \
            --without-gstreamer \
            --disable-tests \
            --disable-win16 \
            CFLAGS="-O2 -pipe" \
            > "$GITHUB_WORKSPACE/wine-configure.log" 2>&1
          tail -15 "$GITHUB_WORKSPACE/wine-configure.log" || true
          test -f include/config.h

      - name: Stage B — libntdll_unix.a
        id: ntdll
        if: steps.wine_cfg.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          cd madeira && mkdir -p app/Madeira "$GITHUB_WORKSPACE/host-libs" host-libs-cache
          if [[ "${SKIP_NTDLL:-0}" == "1" ]]; then
            echo "[ntdll] SKIP — using seeded/cached real archive"
            cp -v "$GITHUB_WORKSPACE/host-libs/libntdll_unix.a" app/Madeira/ 2>/dev/null || \
              cp -v host-libs/libntdll_unix.a app/Madeira/ 2>/dev/null || true
            ls -lh app/Madeira/libntdll_unix.a || true
            exit 0
          fi
          echo "[ntdll] BUILDING..."
          set +e
          bash build/ntdll-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntdll-unix.log"
          set -e
          OBJ=build/ntdll-unix/obj
          objs=()
          while IFS= read -r line; do objs+=("$line"); done < <(find "$OBJ" -name '*.o' -type f 2>/dev/null | sort)
          echo "[ntdll] objs=${#objs[@]}"
          [[ ${#objs[@]} -gt 0 ]] || { echo "no objects"; exit 1; }
          ar rcs app/Madeira/libntdll_unix.a "${objs[@]}"
          test -s app/Madeira/libntdll_unix.a
          cp -v app/Madeira/libntdll_unix.a "$GITHUB_WORKSPACE/host-libs/"
          cp -v app/Madeira/libntdll_unix.a host-libs-cache/
          ls -lh app/Madeira/libntdll_unix.a
          ar t app/Madeira/libntdll_unix.a | head -20

      - name: Stage C — libwineserver.a
        id: wineserver
        if: steps.wine_cfg.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          export PATH="$HOME/toolchains/llvm-mingw/bin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          cd madeira && mkdir -p app/Madeira build/wineserver/obj "$GITHUB_WORKSPACE/host-libs" host-libs-cache
          if [[ "${SKIP_WINESERVER:-0}" == "1" ]]; then
            echo "[wineserver] SKIP"
            cp -v "$GITHUB_WORKSPACE/host-libs/libwineserver.a" app/Madeira/ 2>/dev/null || true
            exit 0
          fi
          echo "[wineserver] BUILDING..."
          # Seed empty archive so build.sh does not fail on missing base
          if [[ ! -s app/Madeira/libwineserver.a ]]; then
            echo 'int madeira_wineserver_seed=0;' | clang -c -x c -o /tmp/ws_seed.o -
            ar rcs app/Madeira/libwineserver.a /tmp/ws_seed.o
            cp app/Madeira/libwineserver.a build/wineserver/obj/libwineserver.a
            rm -f /tmp/ws_seed.o
          fi
          set +e
          bash build/wineserver/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/wineserver.log"
          set -e
          OBJ=build/wineserver/obj
          objs=()
          while IFS= read -r line; do objs+=("$line"); done < <(find "$OBJ" -name '*.o' -type f 2>/dev/null | sort)
          echo "[wineserver] objs=${#objs[@]}"
          if [[ ${#objs[@]} -gt 0 ]]; then
            ar rcs app/Madeira/libwineserver.a "${objs[@]}"
          fi
          if [[ -s app/Madeira/libwineserver.a ]] && [[ $(wc -c < app/Madeira/libwineserver.a) -gt 1000 ]]; then
            cp -v app/Madeira/libwineserver.a "$GITHUB_WORKSPACE/host-libs/"
            cp -v app/Madeira/libwineserver.a host-libs-cache/
            ls -lh app/Madeira/libwineserver.a
            ar t app/Madeira/libwineserver.a | head -20
            echo "[wineserver] OK"
          else
            echo "[wineserver] FAIL"
            tail -40 "$GITHUB_WORKSPACE/wineserver.log" || true
            ls -la "$OBJ" || true
            exit 1
          fi

      - name: Stage D — libwin32u_unix.a
        id: win32u
        if: steps.wine_cfg.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -euo pipefail
          cd madeira && mkdir -p app/Madeira "$GITHUB_WORKSPACE/host-libs" host-libs-cache
          if [[ "${SKIP_WIN32U:-0}" == "1" ]]; then
            echo "[win32u] SKIP"
            cp -v "$GITHUB_WORKSPACE/host-libs/libwin32u_unix.a" app/Madeira/ 2>/dev/null || \
              cp -v host-libs/libwin32u_unix.a app/Madeira/ 2>/dev/null || true
            ls -lh app/Madeira/libwin32u_unix.a || true
            exit 0
          fi
          echo "[win32u] BUILDING..."
          set +e
          bash build/win32u-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/win32u-unix.log"
          set -e
          OBJ=build/win32u-unix/obj
          objs=()
          while IFS= read -r line; do objs+=("$line"); done < <(find "$OBJ" -name '*.o' -type f 2>/dev/null | sort)
          echo "[win32u] objs=${#objs[@]}"
          [[ ${#objs[@]} -gt 0 ]] || { echo "no objects"; exit 1; }
          ar rcs app/Madeira/libwin32u_unix.a "${objs[@]}"
          cp -v app/Madeira/libwin32u_unix.a "$GITHUB_WORKSPACE/host-libs/"
          cp -v app/Madeira/libwin32u_unix.a host-libs-cache/
          ls -lh app/Madeira/libwin32u_unix.a
          ar t app/Madeira/libwin32u_unix.a | head -15

      - name: Stage E — FEX iOS (patch IosCbEntryLog, ninja max)
        id: fex
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -euo pipefail
          if [[ "${SKIP_FEX:-0}" == "1" ]]; then
            echo "[FEX] SKIP"
            mkdir -p "$GITHUB_WORKSPACE/host-libs/fex"
            cp -v host-libs-cache/fex/*.a "$GITHUB_WORKSPACE/host-libs/fex/" 2>/dev/null || true
            exit 0
          fi

          python3 -m pip install --break-system-packages --user packaging setuptools || true
          export PATH="$HOME/Library/Python/3.14/bin:$PATH"

          CPUINFO_STUB="$RUNNER_TEMP/cpuinfo"
          printf '%s\n' \
            'processor       : 0' \
            'BogoMIPS        : 48.00' \
            'Features        : fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp cpuid asimdrdm jscvt fcma lrcpc dcpop sha3 sm3 sm4 asimddp sha512 sve asimdfhm dit uscat ilrcpc flagm ssbs sb paca pacg dcpodp sve2 sveaes svepmull svebitperm svesha3 svesm4 flagm2 frint svei8mm svebf16 i8mm bf16 dgh bti' \
            'CPU implementer : 0x61' \
            'CPU architecture: 8' \
            'CPU variant     : 0x0' \
            'CPU part        : 0x000' \
            'CPU revision    : 0' > "$CPUINFO_STUB"
          mkdir -p "$RUNNER_TEMP/fakeproc"
          cp "$CPUINFO_STUB" "$RUNNER_TEMP/fakeproc/cpuinfo"

          cd madeira/FEX

          # /proc/cpuinfo → stub
          find . -type f \( -name '*.py' -o -name 'CMakeLists.txt' -o -name '*.cmake' -o -name '*.in' \) -print0 | while IFS= read -r -d '' f; do
            if grep -q '/proc/cpuinfo' "$f" 2>/dev/null; then
              sed -i.bak "s|/proc/cpuinfo|$RUNNER_TEMP/fakeproc/cpuinfo|g" "$f"
              echo "patched $f"
            fi
          done

          # Fix undeclared IosCbEntryLog (Madeira iOS callback log)
          if grep -rq 'IosCbEntryLog' FEXCore/Source 2>/dev/null; then
            # Provide a file-scope definition if missing
            if ! grep -rq 'IosCbEntryLog\[' FEXCore/Source --include='*.cpp' --include='*.h' 2>/dev/null | grep -v 'IosCbEntryLog\[' | head -1; then
              :
            fi
            # Inject a weak definition into Core.cpp if the symbol is used but not defined
            CORE=FEXCore/Source/Interface/Core/Core.cpp
            if [[ -f "$CORE" ]] && grep -q 'IosCbEntryLog' "$CORE"; then
              if ! grep -q 'IosCbEntryLog\[8\]' "$CORE"; then
                # Prepend a static definition after the first #include block
                sed -i.bak '0,/#include/s//#include\
#ifndef IOS_CB_ENTRY_LOG_DEFINED\
#define IOS_CB_ENTRY_LOG_DEFINED\
static uint64_t IosCbEntryLog[8] = {};\
#endif\
/' "$CORE" || true
                # Simpler fallback: replace uses with zeros if still broken
                echo "Patched Core.cpp for IosCbEntryLog"
              fi
            fi
            # Also try a global header inject
            cat > FEXCore/include/IosCbEntryLog.h << 'HDR'
#pragma once
#include <stdint.h>
#ifdef __cplusplus
extern "C" {
#endif
#ifndef IOS_CB_ENTRY_LOG_DEFINED
#define IOS_CB_ENTRY_LOG_DEFINED
static uint64_t IosCbEntryLog[8] = {};
#endif
#ifdef __cplusplus
}
#endif
HDR
            # Force-include if compiler supports
            echo "Created IosCbEntryLog.h"
          fi

          git submodule update --init --depth 1 || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          rm -rf build-ios && mkdir -p build-ios && cd build-ios
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DCMAKE_C_COMPILER=$(xcrun -f clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun -f clang++) \
            -DCMAKE_CXX_FLAGS="-include $GITHUB_WORKSPACE/madeira/FEX/FEXCore/include/IosCbEntryLog.h" \
            2>&1 | tee "$GITHUB_WORKSPACE/fex-cmake.log" || true

          if [[ ! -f build.ninja ]]; then
            echo "No build.ninja"
            tail -60 "$GITHUB_WORKSPACE/fex-cmake.log" || true
            exit 1
          fi

          ninja -j "$(sysctl -n hw.ncpu)" 2>&1 | tee "$GITHUB_WORKSPACE/fex-ninja.log" || true

          mkdir -p "$GITHUB_WORKSPACE/host-libs/fex" host-libs-cache/fex
          find . \( -name 'libFEXCore*.a' -o -name 'libfmt.a' -o -name 'libxxhash.a' -o -name 'libcephes*.a' -o -name 'libsoftfloat*.a' -o -name 'libJemalloc*.a' \) \
            | while read -r f; do
                cp -v "$f" "$GITHUB_WORKSPACE/host-libs/fex/"
                cp -v "$f" host-libs-cache/fex/
              done
          ls -lhR "$GITHUB_WORKSPACE/host-libs/fex" || true
          # Prefer real FEXCore
          if ls "$GITHUB_WORKSPACE/host-libs/fex"/libFEXCore*.a 1>/dev/null 2>&1; then
            echo "[FEX] libFEXCore produced"
          else
            echo "[FEX] WARNING: no libFEXCore*.a — only support libs"
            tail -40 "$GITHUB_WORKSPACE/fex-ninja.log" || true
          fi

      - name: Manifest + promote to permanent cache
        if: always()
        run: |
          mkdir -p host-libs host-libs-cache host-libs-cache/fex "$GITHUB_WORKSPACE/host-libs"
          for f in host-libs/*.a "$GITHUB_WORKSPACE/host-libs"/*.a; do
            [[ -s "$f" ]] && [[ $(wc -c < "$f") -gt 10000 ]] && cp -v "$f" host-libs-cache/ 2>/dev/null || true
          done
          for f in host-libs/fex/*.a "$GITHUB_WORKSPACE/host-libs/fex"/*.a; do
            [[ -s "$f" ]] && cp -v "$f" host-libs-cache/fex/ 2>/dev/null || true
          done
          {
            echo "wine=${{ steps.wine_cfg.outcome }} ntdll=${{ steps.ntdll.outcome }} ws=${{ steps.wineserver.outcome }} win32u=${{ steps.win32u.outcome }} fex=${{ steps.fex.outcome }}"
            echo "=== host-libs ==="
            find host-libs "$GITHUB_WORKSPACE/host-libs" -name '*.a' -exec ls -lh {} \; 2>/dev/null
            echo "=== cache ==="
            find host-libs-cache -name '*.a' -exec ls -lh {} \; 2>/dev/null
          } | tee host-libs/MANIFEST.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-host-libs
          path: |
            host-libs/
            host-libs-cache/
            wine-configure.log
            ntdll-unix.log
            wineserver.log
            win32u-unix.log
            fex-cmake.log
            fex-ninja.log
          if-no-files-found: warn
          retention-days: 14

      - name: Require core real archives
        if: always()
        run: |
          # Accept seeded or newly built ntdll + at least one other real .a
          count=$(find host-libs "$GITHUB_WORKSPACE/host-libs" -name '*.a' -size +10k 2>/dev/null | wc -l | tr -d ' ')
          echo "real_archives=$count"
          ls -lh host-libs/*.a "$GITHUB_WORKSPACE/host-libs"/*.a 2>/dev/null || true
          [[ "$count" -gt 0 ]]
