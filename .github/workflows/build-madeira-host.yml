name: Build Madeira Host Libs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-madeira-host.yml

permissions:
  contents: read

env:
  MADEIRA_COMMIT: 97e2ce26e6dc9e4a38976f3b5deb9272d64558eb
  MADEIRA_REPO: https://github.com/willfaust/Madeira.git
  CACHE_VERSION: v10h

jobs:
  host-libs:
    name: Build host static libraries
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Install deps
        run: |
          set -euo pipefail
          brew install cmake ninja flex bison pkg-config python3 coreutils || true
          python3 -m pip install --break-system-packages --user packaging setuptools || true
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/llvm-mingw/bin/aarch64-w64-mingw32-clang" ]; then
            curl -fsSL -o /tmp/llvm-mingw.tar.xz \
              "https://github.com/mstorsjo/llvm-mingw/releases/download/20240619/llvm-mingw-20240619-ucrt-macos-universal.tar.xz" || true
            if [ -s /tmp/llvm-mingw.tar.xz ]; then
              mkdir -p "$HOME/llvm-mingw"
              tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME/llvm-mingw" --strip-components=1 || true
            fi
          fi
          [ -d "$HOME/llvm-mingw/bin" ] && echo "$HOME/llvm-mingw/bin" >> "$GITHUB_PATH" || true

      - name: Cache host libs
        uses: actions/cache@v4
        with:
          path: |
            host-libs-cache
            ~/llvm-mingw
          key: madeira-host-v10h-${{ env.MADEIRA_COMMIT }}
          restore-keys: |
            madeira-host-v10h-
            madeira-host-v10e-

      - name: Prepare dirs
        run: |
          mkdir -p host-libs host-libs/fex host-libs-cache host-libs-cache/fex "$GITHUB_WORKSPACE/host-libs"
          if [ -d host-libs-cache ]; then
            find host-libs-cache -name '*.a' -size +50k -exec cp -v {} host-libs/ \; || true
            find host-libs-cache -path '*/fex/*.a' -size +50k -exec cp -v {} host-libs/fex/ \; || true
          fi
          ls -lh host-libs 2>/dev/null || echo no-cached-libs

      - name: Clone Madeira + wine + FEX
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export GIT_HTTP_LOW_SPEED_LIMIT=1000 GIT_HTTP_LOW_SPEED_TIME=90
          rm -rf madeira
          git clone --filter=blob:none --no-checkout "$MADEIRA_REPO" madeira
          cd madeira
          git fetch --depth 1 origin "$MADEIRA_COMMIT"
          git checkout "$MADEIRA_COMMIT"
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 2 wine
          git -c protocol.version=2 submodule update --init --depth 1 --recommend-shallow --jobs 2 FEX || true
          test -d wine && test -d build/ntdll-unix && test -d build/wineserver

      - name: Wine configure (config.h)
        id: wine_cfg
        timeout-minutes: 12
        run: |
          set -euo pipefail
          export PATH="$HOME/llvm-mingw/bin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          export BISON=/opt/homebrew/opt/bison/bin/bison FLEX=/opt/homebrew/opt/flex/bin/flex
          cd madeira/wine && mkdir -p build-macos && cd build-macos
          if [ ! -f include/config.h ]; then
            ../configure --enable-win64 --without-x --without-freetype --without-gstreamer --disable-tests --disable-win16 CFLAGS="-O2 -pipe" > "$GITHUB_WORKSPACE/wine-configure.log" 2>&1 || true
            tail -20 "$GITHUB_WORKSPACE/wine-configure.log" || true
          fi
          if [ ! -f include/config.h ]; then
            mkdir -p include
            {
              printf '%s\n' '#ifndef WINE_CONFIG_H' '#define WINE_CONFIG_H'
              printf '%s\n' '#define HAVE_SYS_TYPES_H 1' '#define HAVE_SYS_STAT_H 1' '#define HAVE_STDLIB_H 1'
              printf '%s\n' '#define HAVE_STRING_H 1' '#define HAVE_UNISTD_H 1' '#define HAVE_DLFCN_H 1'
              printf '%s\n' '#define HAVE_PTHREAD_H 1' '#define HAVE_SYS_MMAN_H 1' '#define HAVE_SYS_SOCKET_H 1'
              printf '%s\n' '#define HAVE_SYS_UN_H 1' '#define HAVE_POLL 1' '#define HAVE_MMAP 1'
              printf '%s\n' '#endif'
            } > include/config.h
          fi
          test -f include/config.h
          echo "wine_cfg=ok" >> "$GITHUB_OUTPUT"

      - name: Build libntdll_unix.a
        id: ntdll
        continue-on-error: true
        timeout-minutes: 30
        run: |
          set -uo pipefail
          export PATH="$HOME/llvm-mingw/bin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          cd madeira && mkdir -p app/Madeira "$GITHUB_WORKSPACE/host-libs"
          if [ -s "$GITHUB_WORKSPACE/host-libs/libntdll_unix.a" ]; then
            SZ=$(wc -c < "$GITHUB_WORKSPACE/host-libs/libntdll_unix.a")
            if [ "$SZ" -gt 1300000 ]; then
              echo "using-cached-ntdll size=$SZ"
              cp -v "$GITHUB_WORKSPACE/host-libs/libntdll_unix.a" app/Madeira/
              echo "ntdll_ok=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          set +e
          bash build/ntdll-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntdll-unix.log"
          set +e
          OBJ=build/ntdll-unix/obj
          if [ ! -s app/Madeira/libntdll_unix.a ] && [ -d "$OBJ" ]; then
            NOBJ=$(find "$OBJ" -name '*.o' -type f 2>/dev/null | wc -l | tr -d ' ')
            echo "ntdll-objs=$NOBJ"
            [ "$NOBJ" -gt 3 ] && find "$OBJ" -name '*.o' -type f -print0 | xargs -0 ar rcs app/Madeira/libntdll_unix.a
          fi
          if [ -s app/Madeira/libntdll_unix.a ]; then
            cp -v app/Madeira/libntdll_unix.a "$GITHUB_WORKSPACE/host-libs/"
            cp -v app/Madeira/libntdll_unix.a host-libs-cache/
            ls -lh app/Madeira/libntdll_unix.a
            echo "ntdll_ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ntdll_ok=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build libwineserver.a
        id: wineserver
        continue-on-error: true
        timeout-minutes: 35
        run: |
          set -uo pipefail
          cd madeira
          mkdir -p app/Madeira build/wineserver/obj "$GITHUB_WORKSPACE/host-libs"
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          WS=build/wineserver; OBJ=$WS/obj; WINE_SRC=wine; SHIMS=build/ntdll-unix/shims
          if [ -s "$GITHUB_WORKSPACE/host-libs/libwineserver.a" ]; then
            SZ=$(wc -c < "$GITHUB_WORKSPACE/host-libs/libwineserver.a")
            if [ "$SZ" -gt 1000000 ]; then
              echo "using-cached-wineserver size=$SZ"
              cp -v "$GITHUB_WORKSPACE/host-libs/libwineserver.a" app/Madeira/
              echo "wineserver_ok=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          compile_ws() {
            local src=$1 name=$2
            echo -n "  ws $name... "
            if xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 -O2 \
              -I"$WINE_SRC/include" -I"$WINE_SRC/include/wine" -I"$WINE_SRC/build-macos/include" \
              -I"$WS" -I"$WINE_SRC/server" -I"$SHIMS" \
              -include "$WS/config_ios.h" -include stdarg.h -include "$WS/unicode_fix.h" \
              -include "$WS/wineserver_ios_kill.h" -include sys/un.h -include sys/socket.h \
              -DBINDIR=\"/usr/local/bin\" -DDATADIR=\"/usr/local/share\" \
              -D__WINESRC__ -DWINE_IOS=1 -Dmain=wineserver_main \
              -Wno-implicit-function-declaration -Wno-int-conversion -Wno-unused-function \
              -c "$src" -o "$OBJ/$name.o" 2>"$OBJ/err-$name.txt"; then echo OK; else echo FAILED; head -6 "$OBJ/err-$name.txt" || true; return 1; fi
          }
          compile_ws "$WS/main_ios.c" main_ios || true
          compile_ws "$WS/wine_log_ios.c" wine_log_ios || true
          compile_ws "$WS/wineserver_ios_kill.c" wineserver_ios_kill || true
          compile_ws "$WS/unicode_ios_patch.c" unicode_ios_patch || true
          compile_ws "$WS/request_ios.c" request_ios || true
          compile_ws "$WS/mach_ios.c" mach_ios || true
          compile_ws "$WS/unicode_ios.c" unicode_ios || true
          compile_ws "$WS/fd_ios.c" fd_ios || true
          compile_ws "$WS/mapping_ios.c" mapping_ios || true
          compile_ws "$WS/queue_ios.c" queue_ios || true
          compile_ws "$WS/window_ios.c" window_ios || true
          for src in "$WINE_SRC"/server/*.c; do
            [ -f "$src" ] || continue
            name=$(basename "$src" .c)
            case "$name" in main|request|mach|unicode|fd|mapping|queue|window) continue ;; esac
            compile_ws "$src" "srv_$name" || true
          done
          NOBJ=$(find "$OBJ" -name '*.o' -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "wineserver-objs=$NOBJ"
          if [ "$NOBJ" -gt 0 ]; then
            find "$OBJ" -name '*.o' -type f -print0 | xargs -0 ar rcs app/Madeira/libwineserver.a
            cp -v app/Madeira/libwineserver.a "$GITHUB_WORKSPACE/host-libs/"
            cp -v app/Madeira/libwineserver.a host-libs-cache/
            ls -lh app/Madeira/libwineserver.a
            echo "wineserver_ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "wineserver_ok=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build FEXCore for iOS
        id: fex
        continue-on-error: true
        timeout-minutes: 50
        run: |
          set -uo pipefail
          if [ ! -d madeira/FEX ]; then echo "fex_ok=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          rm -f "$GITHUB_WORKSPACE/host-libs"/libFEXCore*.a host-libs/fex/libFEXCore*.a 2>/dev/null || true
          python3 -m pip install --break-system-packages --user packaging setuptools || true
          CPUINFO_STUB="$RUNNER_TEMP/cpuinfo"
          {
            echo 'processor       : 0'
            echo 'BogoMIPS        : 48.00'
            echo 'Features        : fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp cpuid asimdrdm jscvt fcma lrcpc dcpop sha3 sm3 sm4 asimddp sha512 sve'
            echo 'CPU implementer : 0x61'
            echo 'CPU architecture: 8'
            echo 'CPU variant     : 0x0'
            echo 'CPU part        : 0x000'
            echo 'CPU revision    : 0'
          } > "$CPUINFO_STUB"
          mkdir -p "$RUNNER_TEMP/fakeproc" && cp "$CPUINFO_STUB" "$RUNNER_TEMP/fakeproc/cpuinfo"
          cd madeira/FEX
          find . -type f \( -name '*.py' -o -name 'CMakeLists.txt' -o -name '*.cmake' -o -name '*.in' -o -name '*.cpp' -o -name '*.h' \) -print0 | while IFS= read -r -d '' f; do
            grep -q '/proc/cpuinfo' "$f" 2>/dev/null && sed -i.bak "s|/proc/cpuinfo|$RUNNER_TEMP/fakeproc/cpuinfo|g" "$f" || true
          done
          mkdir -p FEXCore/include
          {
            printf '%s\n' '#pragma once'
            printf '%s\n' '#include <stdint.h>'
            printf '%s\n' '#include <stddef.h>'
            printf '%s\n' '#ifdef __cplusplus'
            printf '%s\n' 'extern "C" {'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef IOS_MADEIRA_STUBS_DEFINED'
            printf '%s\n' '#define IOS_MADEIRA_STUBS_DEFINED'
            printf '%s\n' 'static uint64_t IosCbEntryLog[8] = {};'
            printf '%s\n' 'static uint64_t IosFfsBypassLog[8] = {};'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef IOS_WIN32_MEM_STUBS'
            printf '%s\n' '#define IOS_WIN32_MEM_STUBS'
            printf '%s\n' '#ifndef LPCVOID'
            printf '%s\n' 'typedef const void *LPCVOID;'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef PVOID'
            printf '%s\n' 'typedef void *PVOID;'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef DWORD'
            printf '%s\n' 'typedef uint32_t DWORD;'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef SIZE_T'
            printf '%s\n' 'typedef size_t SIZE_T;'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef MEM_IMAGE'
            printf '%s\n' '#define MEM_IMAGE  0x1000000'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef MEM_MAPPED'
            printf '%s\n' '#define MEM_MAPPED 0x40000'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef MEM_PRIVATE'
            printf '%s\n' '#define MEM_PRIVATE 0x20000'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef MEM_COMMIT'
            printf '%s\n' '#define MEM_COMMIT 0x1000'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifndef PAGE_READWRITE'
            printf '%s\n' '#define PAGE_READWRITE 0x04'
            printf '%s\n' '#endif'
            printf '%s\n' 'typedef struct _MEMORY_BASIC_INFORMATION {'
            printf '%s\n' '  PVOID BaseAddress;'
            printf '%s\n' '  PVOID AllocationBase;'
            printf '%s\n' '  DWORD AllocationProtect;'
            printf '%s\n' '  SIZE_T RegionSize;'
            printf '%s\n' '  DWORD State;'
            printf '%s\n' '  DWORD Protect;'
            printf '%s\n' '  DWORD Type;'
            printf '%s\n' '} MEMORY_BASIC_INFORMATION, *PMEMORY_BASIC_INFORMATION;'
            printf '%s\n' 'static inline SIZE_T VirtualQuery(LPCVOID addr, MEMORY_BASIC_INFORMATION *mbi, SIZE_T len) {'
            printf '%s\n' '  if (!mbi || len < sizeof(*mbi)) return 0;'
            printf '%s\n' '  mbi->BaseAddress = (PVOID)(uintptr_t)addr;'
            printf '%s\n' '  mbi->AllocationBase = (PVOID)(uintptr_t)addr;'
            printf '%s\n' '  mbi->AllocationProtect = PAGE_READWRITE;'
            printf '%s\n' '  mbi->RegionSize = 4096;'
            printf '%s\n' '  mbi->State = MEM_COMMIT;'
            printf '%s\n' '  mbi->Protect = PAGE_READWRITE;'
            printf '%s\n' '  mbi->Type = MEM_PRIVATE;'
            printf '%s\n' '  return sizeof(*mbi);'
            printf '%s\n' '}'
            printf '%s\n' '#endif'
            printf '%s\n' '#ifdef __cplusplus'
            printf '%s\n' '}'
            printf '%s\n' '#endif'
          } > FEXCore/include/IosCbEntryLog.h
          git submodule update --init --depth 1 || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          rm -rf build-ios && mkdir -p build-ios && cd build-ios
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DBUILD_TESTING=OFF -DBUILD_THUNKS=OFF -DBUILD_FEXCONFIG=OFF -DBUILD_FEX_LINUX_TESTS=OFF \
            -DENABLE_LTO=OFF -DENABLE_CCACHE=OFF -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DCMAKE_C_COMPILER=$(xcrun -f clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun -f clang++) \
            -DCMAKE_CXX_FLAGS="-include $GITHUB_WORKSPACE/madeira/FEX/FEXCore/include/IosCbEntryLog.h" \
            2>&1 | tee "$GITHUB_WORKSPACE/fex-cmake.log" || true
          if [ ! -f build.ninja ]; then
            echo no-build-ninja; tail -40 "$GITHUB_WORKSPACE/fex-cmake.log" || true
            echo "fex_ok=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          ninja -j "$(sysctl -n hw.ncpu)" 2>&1 | tee "$GITHUB_WORKSPACE/fex-ninja.log" || true
          mkdir -p "$GITHUB_WORKSPACE/host-libs/fex" host-libs-cache/fex
          find . \( -name 'libFEXCore.a' -o -name 'libFEXCore_Base.a' -o -name 'libfmt.a' -o -name 'libxxhash.a' -o -name 'libcephes*.a' -o -name 'libsoftfloat*.a' \) -size +10k | while read -r f; do
            cp -v "$f" "$GITHUB_WORKSPACE/host-libs/fex/"
            cp -v "$f" host-libs-cache/fex/
          done
          if [ -s "$GITHUB_WORKSPACE/host-libs/fex/libFEXCore.a" ]; then
            cp -v "$GITHUB_WORKSPACE/host-libs/fex/libFEXCore.a" "$GITHUB_WORKSPACE/host-libs/"
            ls -lh "$GITHUB_WORKSPACE/host-libs"/libFEXCore.a
            echo FEX-OK
            echo "fex_ok=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo FEX-MISSING
          grep -E "error:" "$GITHUB_WORKSPACE/fex-ninja.log" | head -30 || true
          echo "fex_ok=0" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Verify arm64 Mach-O + symbols
        if: always()
        run: |
          set -uo pipefail
          OUT="$GITHUB_WORKSPACE/host-libs"
          mkdir -p "$OUT"
          echo "=== VERIFY ==="
          for lib in libntdll_unix.a libwineserver.a libFEXCore.a libdxmt_combined.a; do
            f="$OUT/$lib"
            [ -s "$f" ] || f=$(find "$OUT" -name "$lib" 2>/dev/null | head -1)
            if [ -n "${f:-}" ] && [ -s "$f" ]; then
              SZ=$(wc -c < "$f")
              echo "FOUND $lib size=$SZ"
              file "$f" || true
              TMP=$(mktemp -d); (cd "$TMP" && ar x "$f" 2>/dev/null)
              OBJ=$(find "$TMP" -name '*.o' | head -1)
              [ -n "$OBJ" ] && { lipo -info "$OBJ" 2>/dev/null || file "$OBJ"; nm -gU "$OBJ" 2>/dev/null | head -3; }
              rm -rf "$TMP"
            else
              echo "MISSING $lib"
            fi
          done
          {
            echo "commit=$MADEIRA_COMMIT"
            echo "ntdll=${{ steps.ntdll.outputs.ntdll_ok }}"
            echo "wineserver=${{ steps.wineserver.outputs.wineserver_ok }}"
            echo "fex=${{ steps.fex.outputs.fex_ok }}"
            date -u
            find "$OUT" -name '*.a' -exec ls -lh {} \;
          } | tee "$OUT/MANIFEST.txt"

      - name: Persist cache
        if: always()
        run: |
          mkdir -p host-libs-cache host-libs-cache/fex
          find "$GITHUB_WORKSPACE/host-libs" -name '*.a' -size +20k -exec cp -v {} host-libs-cache/ \; || true
          find "$GITHUB_WORKSPACE/host-libs/fex" -name '*.a' -size +20k -exec cp -v {} host-libs-cache/fex/ \; || true

      - name: Upload madeira-host-libs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-host-libs
          path: ${{ github.workspace }}/host-libs
          if-no-files-found: warn
          retention-days: 21
