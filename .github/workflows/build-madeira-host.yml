name: Build Madeira Host Libs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-madeira-host.yml"

permissions:
  contents: read

env:
  MADEIRA_COMMIT: 97e2ce26e6dc9e4a38976f3b5deb9272d64558eb
  MADEIRA_REPO: https://github.com/willfaust/Madeira.git
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20260826/llvm-mingw-20260826-ucrt-macos-universal.tar.xz

jobs:
  host-libs:
    name: Build host static libraries
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      - name: Install build deps + llvm-mingw
        run: |
          set -euo pipefail
          brew install cmake ninja flex bison pkg-config wget python3 || true
          python3 -m pip install --break-system-packages --user packaging setuptools || \
            pip3 install --break-system-packages --user packaging setuptools || true
          echo "/opt/homebrew/opt/bison/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/opt/flex/bin" >> "$GITHUB_PATH"
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"

          mkdir -p "$HOME/toolchains"
          if [[ ! -x "$HOME/toolchains/llvm-mingw/bin/aarch64-w64-mingw32-clang" ]]; then
            curl -L --retry 3 -o /tmp/llvm-mingw.tar.xz "$LLVM_MINGW_URL"
            tar -xJf /tmp/llvm-mingw.tar.xz -C "$HOME/toolchains"
            ln -sfn "$HOME/toolchains"/llvm-mingw-*-ucrt-macos-universal "$HOME/toolchains/llvm-mingw"
            rm -f /tmp/llvm-mingw.tar.xz
          fi
          echo "$HOME/toolchains/llvm-mingw/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/toolchains/llvm-mingw/bin:$PATH"
          aarch64-w64-mingw32-clang --version | head -1 || true
          which llvm-dlltool || true

          echo "BISON=$(command -v bison)"; bison --version | head -1
          echo "FLEX=$(command -v flex)"; flex --version | head -1
          python3 -c "from packaging.version import Version; print('packaging OK', Version('1.0'))" || true

      - name: Clone Madeira + wine + FEX
        run: |
          set -euo pipefail
          rm -rf madeira
          git clone --filter=blob:none --no-checkout "$MADEIRA_REPO" madeira
          cd madeira
          git fetch --depth 1 origin "$MADEIRA_COMMIT"
          git checkout "$MADEIRA_COMMIT"
          git submodule update --init --depth 1 wine FEX
          echo "wine=$(git -C wine rev-parse --short HEAD) FEX=$(git -C FEX rev-parse --short HEAD)"

      - name: Stage A — Wine host configure
        id: wine_cfg
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="$HOME/toolchains/llvm-mingw/bin:/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          export BISON="/opt/homebrew/opt/bison/bin/bison"
          export FLEX="/opt/homebrew/opt/flex/bin/flex"
          "$BISON" --version | head -1
          which aarch64-w64-mingw32-clang
          cd madeira/wine
          mkdir -p build-macos && cd build-macos
          set +e
          ../configure \
            --enable-win64 \
            --without-x \
            --without-freetype \
            --without-gstreamer \
            --disable-tests \
            --disable-win16 \
            CFLAGS="-O2" \
            > "$GITHUB_WORKSPACE/wine-configure.log" 2>&1
          rc=$?
          set -e
          tail -60 "$GITHUB_WORKSPACE/wine-configure.log" || true
          if [[ $rc -ne 0 ]]; then
            echo "configure exit $rc"
            exit $rc
          fi
          if [[ ! -f include/config.h ]]; then
            echo "config.h missing after successful configure"
            find . -name config.h | head
            exit 1
          fi
          ls -la include/config.h

      - name: Stage B — libntdll_unix.a
        id: ntdll
        if: steps.wine_cfg.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          cd madeira && mkdir -p app/Madeira
          bash build/ntdll-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/ntdll-unix.log"
          test -s app/Madeira/libntdll_unix.a
          mkdir -p "$GITHUB_WORKSPACE/host-libs"
          cp -v app/Madeira/libntdll_unix.a "$GITHUB_WORKSPACE/host-libs/"
          file app/Madeira/libntdll_unix.a
          ls -lh app/Madeira/libntdll_unix.a

      - name: Stage C — libwineserver.a
        id: wineserver
        if: steps.wine_cfg.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:/opt/homebrew/opt/llvm/bin:$PATH"
          cd madeira && mkdir -p app/Madeira
          bash build/wineserver/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/wineserver.log"
          test -s app/Madeira/libwineserver.a
          mkdir -p "$GITHUB_WORKSPACE/host-libs"
          cp -v app/Madeira/libwineserver.a "$GITHUB_WORKSPACE/host-libs/"

      - name: Stage D — libwin32u_unix.a
        id: win32u
        if: steps.wine_cfg.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          cd madeira
          bash build/win32u-unix/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/win32u-unix.log"
          test -s app/Madeira/libwin32u_unix.a
          mkdir -p "$GITHUB_WORKSPACE/host-libs"
          cp -v app/Madeira/libwin32u_unix.a "$GITHUB_WORKSPACE/host-libs/"

      - name: Stage E — FEX iOS static libs
        id: fex
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m pip install --break-system-packages --user packaging setuptools || true
          export PATH="$HOME/Library/Python/3.14/bin:$HOME/Library/Python/3.*/bin:$PATH"

          # FEX Scripts open /proc/cpuinfo; macOS has no /proc — write a stub
          sudo mkdir -p /proc
          if [[ ! -f /proc/cpuinfo ]]; then
            printf '%s\n' \
              'processor       : 0' \
              'BogoMIPS        : 48.00' \
              'Features        : fp asimd evtstrm aes pmull sha1 sha2 crc32 atomics fphp asimdhp cpuid asimdrdm jscvt fcma lrcpc dcpop sha3 sm3 sm4 asimddp sha512 sve asimdfhm dit uscat ilrcpc flagm ssbs sb paca pacg dcpodp sve2 sveaes svepmull svebitperm svesha3 svesm4 flagm2 frint svei8mm svebf16 i8mm bf16 dgh bti' \
              'CPU implementer : 0x61' \
              'CPU architecture: 8' \
              'CPU variant     : 0x0' \
              'CPU part        : 0x000' \
              'CPU revision    : 0' | sudo tee /proc/cpuinfo >/dev/null
          fi

          cd madeira/FEX
          git submodule update --init --depth 1 || true
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          rm -rf build-ios && mkdir -p build-ios && cd build-ios
          cmake .. -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=17.0 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DBUILD_TESTING=OFF \
            -DBUILD_THUNKS=OFF \
            -DBUILD_FEXCONFIG=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DENABLE_LTO=OFF \
            -DENABLE_CCACHE=OFF \
            -DENABLE_JEMALLOC_GLIBC_ALLOC=OFF \
            -DENABLE_FEX_ALLOCATOR=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DCMAKE_C_COMPILER=$(xcrun -f clang) \
            -DCMAKE_CXX_COMPILER=$(xcrun -f clang++) \
            2>&1 | tee "$GITHUB_WORKSPACE/fex-cmake.log"
          ninja -j "$(sysctl -n hw.ncpu)" 2>&1 | tee "$GITHUB_WORKSPACE/fex-ninja.log"
          mkdir -p "$GITHUB_WORKSPACE/host-libs/fex"
          find . -name 'libFEXCore*.a' -o -name 'libfmt.a' -o -name 'libxxhash.a' \
            | while read -r f; do cp -v "$f" "$GITHUB_WORKSPACE/host-libs/fex/"; done
          ls -lhR "$GITHUB_WORKSPACE/host-libs/fex" || true
          test -n "$(ls "$GITHUB_WORKSPACE/host-libs/fex"/*.a 2>/dev/null || true)"

      - name: Manifest
        if: always()
        run: |
          mkdir -p host-libs
          {
            echo "wine=${{ steps.wine_cfg.outcome }} ntdll=${{ steps.ntdll.outcome }} ws=${{ steps.wineserver.outcome }} win32u=${{ steps.win32u.outcome }} fex=${{ steps.fex.outcome }}"
            find host-libs -name '*.a' -exec ls -lh {} \;
          } | tee host-libs/MANIFEST.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: madeira-host-libs
          path: |
            host-libs/
            wine-configure.log
            ntdll-unix.log
            wineserver.log
            win32u-unix.log
            fex-cmake.log
            fex-ninja.log
          if-no-files-found: warn

      - name: Require real .a
        if: always()
        run: |
          count=$(find host-libs -name '*.a' -size +1k 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count"
          [[ "$count" -gt 0 ]]
